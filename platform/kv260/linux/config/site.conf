MACHINE = "amd-cortexa53-mali-common"
DISTRO = "amd-edf-small"
DL_DIR = "/work/downloads"
SSTATE_DIR = "/work/sstate-cache"
BB_NUMBER_THREADS = "8"
PARALLEL_MAKE = "-j8"
# Keep the full driver-capable kernel for bring-up, not linux-xlnx-small.
PREFERRED_PROVIDER_virtual/kernel = "linux-xlnx"
PREFERRED_PROVIDER_virtual/kernel:zynqmp = "linux-xlnx"
PREFERRED_VERSION_linux-xlnx = "6.18.0%"
KERNEL_IMAGETYPE = "Image"
KERNEL_DEVICETREE = "xilinx/zynqmp-smk-k26-revA-sck-kv-g-revA.dtb xilinx/zynqmp-smk-k26-revA-sck-kv-g-revB.dtb"
KERNEL_DTBVENDORED = "false"
EXTRA_IMAGE_FEATURES = ""
SERIAL_CONSOLES = "115200;ttyPS1"
hostname:pn-base-files:amd-edf = "z486"
# This image is not an AMD cross-development SDK.
SDK_CLASSES:remove = "amd-qemu-xilinx-sdk-tools amd-misc-sdk-tools"
